server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: blindtest-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://ep-round-wildflower-b2n3zyw4-pooler.c-6.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:neondb_owner}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

# Configuration du moteur de Blind Test
blindtest:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  game:
    rounds-per-match: 10
    round-duration-seconds: 20
    first-guess-timeout-seconds: 5
    bonus-duration-seconds: 10
    steal-enabled: true
  matchmaking:
    base-range: 50
    range-step: 25
    step-interval-seconds: 3
    max-range: 300
    scheduler-period-ms: 1000
  deezer:
    base-url: https://api.deezer.com

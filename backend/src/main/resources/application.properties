server.port=8080
spring.application.name=blindtest-backend

# Import configuration locale si présente (secrets hors git)
spring.config.import=optional:classpath:application-local.properties

# Neon PostgreSQL Cloud Database
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-round-wildflower-b2n3zyw4-pooler.c-6.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:YOUR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Configuration du moteur de Blind Test
blindtest.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
blindtest.game.rounds-per-match=10
blindtest.game.round-duration-seconds=20
blindtest.game.first-guess-timeout-seconds=5
blindtest.game.bonus-duration-seconds=10
blindtest.game.steal-enabled=true

# Matchmaking
blindtest.matchmaking.base-range=50
blindtest.matchmaking.range-step=25
blindtest.matchmaking.step-interval-seconds=3
blindtest.matchmaking.max-range=300
blindtest.matchmaking.scheduler-period-ms=1000

# Deezer API
blindtest.deezer.base-url=https://api.deezer.com

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
